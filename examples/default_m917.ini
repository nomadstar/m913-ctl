# Redragon M917-PRO (Compx) default configuration (from Cfg.ini)
# Restores factory defaults for the M917-PRO.
# Apply with: ./build/m913-ctl --config examples/default_m917.ini

[mouse]
polling_rate=1000

[dpi]
dpi1=800
dpi1_color=ff0000
dpi2=1600
dpi2_color=0000ff
dpi3=3200
dpi3_color=00ff00
dpi4=8000
dpi4_color=ff00ff
dpi5=16000
dpi5_color=ffff00

[buttons]
# Mouse clicks
button_left=left
button_right=right
button_middle=middle

# Forward / Backward
button_side1=backward
button_side2=forward

# DPI button (physical DPI key = button_side3 → proto index 5)
# Sends 08 a2 09 05 to the firmware; firmware then cycles DPI level
# and notifies host via 08 0a 00 00 00 0a <slot> ...
button_side3=dpi_cycle






